name: Deploy al VPS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22022
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git pull --ff-only
            [ -f .env ] && set -a && . ./.env && set +a
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait db
            docker exec -i mc-db psql -U "${POSTGRES_USER:-miriam}" -d "${POSTGRES_DB:-miriam_campos}" < db/migrate.sql
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
