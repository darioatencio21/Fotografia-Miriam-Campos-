# Despliegue automático al VPS.
#
# PENDIENTE cuando compres el VPS:
#   1) En GitHub: Settings → Secrets and variables → Actions, crea:
#      VPS_HOST (IP del servidor), VPS_USER (usuario SSH),
#      VPS_SSH_KEY (clave privada) y VPS_PROJECT_DIR (ruta del repo en el VPS).
#   2) Descomenta el bloque "on: push" de abajo.
#
# Mientras tanto el despliegue es manual desde la pestaña Actions.

name: Deploy al VPS

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
